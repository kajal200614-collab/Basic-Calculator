<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <div id="display">0</div>

        <div class="buttons">

            <button class="function" onclick="clearDisplay()">AC</button>
            <button class="function" onclick="add('%')">%</button>
            <button class="function" onclick="deleteLast()">⌫</button>
            <button class="operator" onclick="add('/')">÷</button>

            <button onclick="add('7')">7</button>
            <button onclick="add('8')">8</button>
            <button onclick="add('9')">9</button>
            <button class="operator" onclick="add('*')">×</button>

            <button onclick="add('4')">4</button>
            <button onclick="add('5')">5</button>
            <button onclick="add('6')">6</button>
            <button class="operator" onclick="add('-')">−</button>

            <button onclick="add('1')">1</button>
            <button onclick="add('2')">2</button>
            <button onclick="add('3')">3</button>
            <button class="operator" onclick="add('+')">+</button>

            <button onclick="add('00')">00</button>
            <button onclick="add('0')">0</button>
            <button onclick="add('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
